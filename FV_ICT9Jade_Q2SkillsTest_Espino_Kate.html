<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Skills Test </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

    <style>
        body {
           
            background-image: url('https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/affba656-d015-4b96-a8ba-3ef5bbbc2c39/OBMC+MONTESSORI+GH+-+AY+2026+FA.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
        }
    </style>
</head>
<body>

 
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
          
                <img src="https://www.facebook.com/obmcofficial/photos/908179694676486/" alt="Logo" width="30" height="30" class="rounded-circle me-2">
                Enroll Now
            </a>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>
    </nav>


    <div class="container text-center text-white mt-4">
        <h1>
            <img src="https://placeholder.com" alt="OBMC Logo" width="45" height="45" class="rounded-circle me-2">
            OBMC Student Enrollment Form
        </h1>
        <p>Fill out the form below to enroll for the upcoming school year.</p>
    </div>


    <div class="container mt-4 mb-5">
        <div class="form-container mx-auto shadow">
            <form>
        
                <h2 class="h5 mb-3">Student Information</h2>
                
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="John">
                    </div>
                    <div class="col">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Doe">
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col">
                        <label class="form-label">Birth Date</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="col">
                        <label class="form-label">Gender</label>
                        <select class="form-select">
                            <option selected>Select...</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label">Grade Level</label>
                        <select class="form-select">
                            <option selected>Select...</option>
                            <option value="7">Grade 7</option>
                            <option value="8">Grade 8</option>
                            <option value="9">Grade 9</option>
                            <option value="10">Grade 10</option>
                        </select>
                    </div>
                </div>

                <h2 class="h5 mb-3">Contact Details</h2>
                
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="student@example.com">
                </div>

                <div class="mb-4">
                    <label class="form-label">Contact Number</label>
                    <input type="text" class="form-control" placeholder="0912-345-6789">
                </div>

                <h2 class="h5 mb-3">Other Information</h2>

                <div class="mb-3">
                    <label class="form-label">Mode of Learning</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="learningMode" id="online">
                        <label class="form-check-label" for="online">Online</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="learningMode" id="f2f">
                        <label class="form-check-label" for="f2f">Face-to-Face</label>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="confirm">
                    <label class="form-check-label" for="confirm">
                        I confirm that the information provided is true and complete.
                    </label>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary px-4">Submit Enrollment</button>
                </div>
            </form>
        </div>
    </div>
